name: daily-market-regime

on:
  schedule:
    - cron: "30 1 * * *"      # 01:30 UTC daily — after the F&G + Binance daily close
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write              # to commit the refreshed data files

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r backend/requirements.txt

      - name: Build today's reading
        run: python backend/run_daily.py

      - name: Refresh backtest scorecard
        run: python backend/backtest.py

      - name: Commit data if changed
        run: |
          git config user.name  "market-regime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json data/history.csv data/backtest.json
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: reading for $(date -u +%Y-%m-%d)"
            git push
          fi
