name: network-diag
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe every external host the pipeline uses
        run: |
          check() {
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 8 -A "Mozilla/5.0" "$1" || echo "TIMEOUT/ERR")
            printf "%-70s %s\n" "$1" "$code"
          }
          check "https://query1.finance.yahoo.com/v8/finance/chart/BTC-USD?range=5d"
          check "https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT"
          check "https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=1"
          check "https://api.alternative.me/fng/"
          check "https://stablecoins.llama.fi/stablecoincharts/all"
          check "https://api.blockchain.info/charts/miners-revenue?timespan=5days&format=json"
          check "https://community-api.coinmetrics.io/v4/timeseries/asset-metrics?assets=btc&metrics=AdrActCnt&frequency=1d&page_size=1"
          check "https://api.coingecko.com/api/v3/global"
          check "https://api.bybit.com/v5/market/funding/history?category=linear&symbol=BTCUSDT&limit=1"
          check "https://api.bybit.com/v5/market/open-interest?category=linear&symbol=BTCUSDT&intervalTime=1d&limit=1"
          check "https://api.bybit.com/v5/market/account-ratio?category=linear&symbol=BTCUSDT&period=1d&limit=1"
          check "https://www.deribit.com/api/v2/public/get_volatility_index_data?currency=BTC&resolution=86400&start_timestamp=1&end_timestamp=2"
          check "https://api.stlouisfed.org/fred/series/observations?series_id=FEDFUNDS&api_key=test&file_type=json"
          check "https://api.sosovalue.xyz/openapi/v2/etf/currentEtfDataMetrics"
          check "https://bitcointreasuries.net/"
